# pnpm settings live here (pnpm 10+ no longer reads the package.json "pnpm" field).
onlyBuiltDependencies:
  - esbuild

overrides:
  # Security: force the transitive brace-expansion (pulled via
  # @vue/test-utils > js-beautify > editorconfig > minimatch) to a patched
  # release — GHSA-3jxr-9vmj-r5cp (DoS via exponential brace expansion). This is
  # a dev-only dependency (never shipped in dist); the override keeps
  # `pnpm audit --audit-level=moderate` green. Bounded to ^5.0.7 (the version
  # eslint already resolves, so the tree dedupes to one) rather than an
  # open-ended `>=` range.
  "brace-expansion@>=2.0.0 <2.1.2": "^5.0.7"

  # Security: force the transitive fast-uri (pulled via
  # stylelint > table > ajv > fast-uri) to a patched release —
  # GHSA-v2hh-gcrm-f6hx (host confusion via a literal backslash authority
  # delimiter). Dev-only (never shipped in dist); keeps
  # `pnpm audit --audit-level=moderate` green.
  "fast-uri@>=3.0.0 <=3.1.3": "^3.1.4"
