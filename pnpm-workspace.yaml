# Canonical pnpm configuration. pnpm 10 also reads package.json#pnpm;
# keeping overrides here avoids two conflicting sources of dependency policy.
onlyBuiltDependencies:
  - esbuild

overrides:
  # Consolidate the previously effective package-level constraints, then apply
  # the October 2026 patch floors identified by pnpm audit.
  postcss: ">=8.5.18"
  # GHSA-3jxr-9vmj-r5cp (brace expansion DoS)
  brace-expansion: "^5.0.12"
  # URI normalization advisories; retain the existing 3.x constraint.
  fast-uri: "^3.1.8"
  # GHSA-2wm5-q62r-hmrv (color parser ReDoS)
  colord: ">=2.9.4"
  # GHSA-2883-xcg3-v3hh (YAML merge-key CPU DoS)
  js-yaml: "^4.3.2"
  # Preserve the previously documented safety net; current lock already uses 3.3.18.
  "nanoid@<3.3.18": "^3.3.18"
  # GHSA-rfgv-xxqx-mfg5 and related HTTP/WebSocket advisories (jsdom only).
  "undici@>=7.0.0 <7.29.1": "^7.29.1"
